[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.26"
evm_version = "cancun"
via_ir = true
optimizer = true
optimizer_runs = 200
ffi = true
gas_limit = "3000000000"
fs_permissions = [{ access = "read", path = "../research" }, { access = "read-write", path = "./deployments" }]

[fuzz]
runs = 256

[profile.ci.fuzz]
runs = 2000
[lint]
lint_on_build = false
